server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # The existing api/ Deployment, unchanged, in the 2take1 namespace --
    # manual add/toggle/delete go straight there, same as site/todo.html.
    location /api/ {
        proxy_pass http://api.2take1.svc.cluster.local:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
        proxy_pass http://websocket-gateway:8082/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
