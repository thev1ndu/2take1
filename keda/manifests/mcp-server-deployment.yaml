apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server
  namespace: todo-agent
  labels:
    app: mcp-server
    app.kubernetes.io/name: mcp-server
spec:
  replicas: 1
  selector:
    matchLabels: { app: mcp-server }
  template:
    metadata:
      labels:
        app: mcp-server
        app.kubernetes.io/name: mcp-server
    spec:
      containers:
        - name: mcp-server
          image: ghcr.io/thev1ndu/taskdone-mcp-server:0.1.0
          ports:
            - containerPort: 8081
          env:
            - name: REDIS_ADDR
              value: "redis:6379"
            - name: API_BASE_URL
              # Cross-namespace: the existing api/ Deployment, untouched,
              # in the 2take1 namespace.
              value: "http://api.2take1.svc.cluster.local:8080"
          readinessProbe:
            httpGet: { path: /readyz, port: 8081 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8081 }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { memory: "32Mi", cpu: "20m" }
            limits: { memory: "128Mi", cpu: "250m" }
