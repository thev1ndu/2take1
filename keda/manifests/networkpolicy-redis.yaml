# Redis holds the priority KV, the agent:tasks queue, and pub/sub -- only
# the pods that actually need it may connect. `web` and any external
# ingress never touch Redis directly.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-ingress
  namespace: todo-agent
  labels:
    app.kubernetes.io/name: redis
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: todo-agent
      ports:
        - protocol: TCP
          port: 6379
