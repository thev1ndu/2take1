apiVersion: v1
kind: ConfigMap
metadata:
  name: web-html-v1
  namespace: 2take1
data:
  index.html: |
    <!doctype html>
    <html lang="en">
      <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>2take1 (v1)</title>
        <style>
          body { background: #0b0b0b; color: #3ddc84; font-family: monospace; text-align: center; margin-top: 8vh; }
          pre { font-size: 1rem; line-height: 1.1; }
          p { letter-spacing: 0.1em; }
          nav { margin-top: 4vh; }
          nav a {
            display: inline-block;
            color: #3ddc84;
            text-decoration: none;
            border: 1px solid #3ddc84;
            padding: 0.5em 1em;
            margin: 0.3em;
            border-radius: 4px;
            transition: background 0.2s ease, color 0.2s ease;
          }
          nav a:hover { background: #3ddc84; color: #0b0b0b; }
        </style>
      </head>
      <body>
        <pre>
     ___ _____ __  _  _____ __
    (_  |_   _/  \| |/ / __/  |
     / /  | || /\ |   <| _|`7 |
    |___| |_||_||_|_|\_\___||_|
        </pre>
        <p>(v1 / stable)</p>
        <nav>
          <a href="https://rancher.2take1.nl">rancher</a>
          <a href="https://harbor.2take1.nl">harbor</a>
          <a href="https://grafana.2take1.nl">grafana</a>
          <a href="https://argocd.2take1.nl">argocd</a>
          <a href="https://jenkins.2take1.nl">jenkins</a>
        </nav>
      </body>
    </html>
