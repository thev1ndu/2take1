apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: 2take1
  namespace: 2take1
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - 2take1.nl
      secretName: 2take1-tls
  rules:
    - host: 2take1.nl
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: 2take1
                port: { number: 80 }
