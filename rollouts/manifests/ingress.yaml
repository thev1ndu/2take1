apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: 2take1
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    traefik.ingress.kubernetes.io/router.middlewares: auth-oauth-errors@kubernetescrd,auth-oauth-auth@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts: [2take1.nl]
      secretName: 2take1-tls
  rules:
    - host: 2take1.nl
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port: { number: 80 }
