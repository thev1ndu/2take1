apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: 2take1
  namespace: 2take1
spec:
  replicas: 4
  revisionHistoryLimit: 3
  selector:
    matchLabels: { app: 2take1 }
  template:
    metadata:
      labels: { app: 2take1 }
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
          resources:
            requests: { memory: "16Mi", cpu: "10m" }
            limits: { memory: "64Mi", cpu: "100m" }
      volumes:
        - name: html
          configMap:
            # Swap to web-html-v2 (or run `kubectl argo rollouts set image` /
            # patch this field) to trigger a new canary rollout for testing.
            name: web-html-v1
  strategy:
    canary:
      steps:
        - setWeight: 20
        - pause: { duration: 30s }
        - setWeight: 50
        - pause: { duration: 30s }
        - setWeight: 80
        - pause: { duration: 30s }
