apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# No blanket `namespace:` here -- every resource below declares its own
# namespace in metadata (2take1 for the app, ci for Tekton), so kustomize's
# namespace transformer is intentionally not used to avoid overriding that.

resources:
  - manifests/namespace.yaml
  - manifests/db-statefulset.yaml
  - manifests/db-service.yaml
  - manifests/api-deployment.yaml
  - manifests/api-service.yaml
  # web-deployment/web-service/ingress are superseded by ../rollouts/ --
  # the Rollout there now owns serving 2take1.nl. Re-enable these only if
  # the rollouts/ Application is torn down and this repo goes back to
  # serving the site via a plain Deployment.
  # - manifests/web-deployment.yaml
  # - manifests/web-service.yaml
  # - manifests/ingress.yaml
  # - tekton/namespace/ci.yaml
  # - tekton/serviceaccount/ci-builder.yaml
  # - tekton/task/image-metadata.yaml
  # - tekton/task/buildkit-build-push.yaml
  # - tekton/pipeline/build-and-push.yaml
  # - tekton/triggertemplate/build-and-push.yaml
  # - tekton/triggerbinding/github-push.yaml
  # - tekton/eventlistener/github-listener.yaml
  # tekton/pipelinerun/build-and-push-manual.yaml
