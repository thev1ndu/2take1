# Not included in kustomization.yaml on purpose — do not commit real credentials.
# Create the real secret out-of-band before the first apply, e.g.:
#
#   kubectl create secret generic 2take1-db-credentials \
#     --namespace 2take1 \
#     --from-literal=password="$(openssl rand -base64 24)"
#
# db-statefulset.yaml uses this single value for both MYSQL_ROOT_PASSWORD and
# MYSQL_PASSWORD (root and the 2take1 app user share one credential).
# api-deployment.yaml reads the same key to connect as the 2take1 app user.
apiVersion: v1
kind: Secret
metadata:
  name: 2take1-db-credentials
  namespace: 2take1
type: Opaque
stringData:
  password: CHANGEME
