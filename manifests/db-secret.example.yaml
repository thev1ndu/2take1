# Not included in kustomization.yaml on purpose — do not commit real credentials.
# Create the real secret out-of-band before the first apply, e.g.:
#
#   kubectl create secret generic klyde-db-credentials \
#     --namespace klyde \
#     --from-literal=password="$(openssl rand -base64 24)"
#
# db-statefulset.yaml uses this single value for both MYSQL_ROOT_PASSWORD and
# MYSQL_PASSWORD (root and the klyde app user share one credential).
# api-deployment.yaml reads the same key to connect as the klyde app user.
apiVersion: v1
kind: Secret
metadata:
  name: klyde-db-credentials
  namespace: klyde
type: Opaque
stringData:
  password: CHANGEME
