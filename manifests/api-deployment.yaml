apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: klyde
spec:
  replicas: 1
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      containers:
        - name: api
          image: ghcr.io/thev1ndu/klyde-api:latest
          ports:
            - containerPort: 8080
          env:
            - name: DB_ADDR
              value: "db:3306"
            - name: DB_USER
              value: klyde
            - name: DB_NAME
              value: klyde
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: klyde-db-credentials
                  key: password
          readinessProbe:
            httpGet: { path: /api/healthz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/healthz, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { memory: "32Mi", cpu: "20m" }
            limits:   { memory: "128Mi", cpu: "250m" }
