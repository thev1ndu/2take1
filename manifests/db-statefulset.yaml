apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
  namespace: klyde
spec:
  serviceName: db
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels: { app: db }
  template:
    metadata:
      labels: { app: db }
    spec:
      containers:
        - name: mariadb
          image: lscr.io/linuxserver/mariadb:latest
          ports:
            - containerPort: 3306
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: klyde-db-credentials
                  key: password
            - name: MYSQL_DATABASE
              value: klyde
            - name: MYSQL_USER
              value: klyde
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: klyde-db-credentials
                  key: password
          volumeMounts:
            - name: data
              mountPath: /config
          readinessProbe:
            tcpSocket:
              port: 3306
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 3306
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: { memory: "192Mi", cpu: "50m" }
            limits: { memory: "384Mi", cpu: "500m" }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
