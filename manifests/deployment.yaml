apiVersion: apps/v1
kind: Deployment
metadata:
  name: landing
  namespace: klyde
spec:
  replicas: 1
  selector:
    matchLabels: { app: landing }
  template:
    metadata:
      labels: { app: landing }
    spec:
      containers:
        - name: nginx
          image: ghcr.io/thev1ndu/klyde:latest
          ports:
            - containerPort: 80
          resources:
            requests: { memory: "16Mi", cpu: "10m" }
            limits:   { memory: "64Mi", cpu: "100m" }
