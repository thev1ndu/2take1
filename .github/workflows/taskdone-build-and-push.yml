name: TaskDone Build and Push

on:
  push:
    branches: [main]
    paths:
      - "keda/mcp-server/**"
      - "keda/agent-worker/**"
      - "keda/websocket-gateway/**"
      - "keda/web/**"
      - ".github/workflows/taskdone-build-and-push.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: mcp-server
            context: keda/mcp-server
          - service: agent-worker
            context: keda/agent-worker
          - service: websocket-gateway
            context: keda/websocket-gateway
          - service: web
            context: keda/web
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Hardcoded `taskdone-` prefix, independent of the repo/owner name,
          # so every image reads ghcr.io/<owner>/taskdone-<service> regardless
          # of what this repository itself is called.
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/taskdone-${{ matrix.service }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=taskdone-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=taskdone-${{ matrix.service }}
